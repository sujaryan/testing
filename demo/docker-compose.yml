# docker-compose.yml — local demo stack for wc-course-booking.
#
# Starts WordPress + MariaDB and mounts the plugin source directly so edits
# on the host show up immediately inside the container. A one-shot wp-cli
# service installs WordPress, activates WooCommerce, activates our plugin,
# and seeds two demo course products (a 1:1 course and a group class).
#
# Usage:
#   cd demo
#   docker compose up -d db wordpress
#   docker compose run --rm wpcli bash /seed/setup.sh
#   open http://localhost:8080
#
# Credentials:
#   WP admin: admin / admin   (http://localhost:8080/wp-admin)
#   MariaDB:  wp / wp         (database: wordpress)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.5-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ../wc-course-booking:/var/www/html/wp-content/plugins/wc-course-booking

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../wc-course-booking:/var/www/html/wp-content/plugins/wc-course-booking
      - ./:/seed:ro

volumes:
  db_data:
  wp_data:
